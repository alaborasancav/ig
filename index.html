<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sancav | ig Analiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #f9fafb; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .sancav-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: #cbd5e1 !important; resize: none; transition: 0.3s; }
        textarea:focus { border-color: #6366f1 !important; outline: none; box-shadow: 0 0 15px rgba(99, 102, 241, 0.15); }
        .user-card { background: #0d1321; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body class="flex flex-col items-center p-4 md:p-10">

    <div class="w-full max-w-4xl glass p-8 md:p-12 rounded-[2.5rem] shadow-2xl mt-4">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black italic tracking-tighter uppercase text-white bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
                Sancav Analiz
            </h1>
            <p class="text-gray-500 text-[10px] mt-2 tracking-[0.3em] uppercase font-bold italic">Sadece Seni Takip Etmeyenleri Yakalar</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-3">
                <div class="flex justify-between items-center px-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-indigo-500 italic">Takip Ettiklerin</label>
                    <span id="countFollowing" class="text-[10px] font-mono text-gray-400">0</span>
                </div>
                <textarea id="following" oninput="sayilariGuncelle()" placeholder="Instagram'dan kopyaladığın listeyi buraya yapıştır..." class="w-full h-64 p-5 rounded-2xl text-xs"></textarea>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-indigo-500 italic">Takipçilerin</label>
                    <span id="countFollowers" class="text-[10px] font-mono text-gray-400">0</span>
                </div>
                <textarea id="followers" oninput="sayilariGuncelle()" placeholder="Takipçi listesini buraya yapıştır..." class="w-full h-64 p-5 rounded-2xl text-xs"></textarea>
            </div>
        </div>

        <button onclick="kacaklariBul()" class="w-full mt-10 py-6 rounded-2xl sancav-gradient font-black text-white text-sm uppercase tracking-[0.3em] shadow-2xl active:scale-95 transition-all">
            KAÇAKLARI YAKALA
        </button>

        <div id="resultArea" class="hidden mt-16 border-t border-slate-800 pt-10">
            <div class="flex justify-between items-center mb-8 px-2">
                <h2 class="text-xl font-black italic uppercase text-white">Seni Ekenler</h2>
                <span id="badCount" class="bg-red-500/10 text-red-500 px-4 py-1.5 rounded-full text-xs font-black border border-red-500/20">0 KİŞİ</span>
            </div>
            <div id="results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>
    </div>

    <footer class="mt-16 mb-10 text-[9px] text-gray-700 tracking-[0.8em] uppercase font-black italic">
        created by sancav
    </footer>

    <script>
        function temizle(metin) {
            if (!metin) return [];
            // Regex: Sadece kullanıcı adı formatındaki kelimeleri seçer
            const regex = /([a-z0-9._]{3,30})/gi;
            const bulunanlar = metin.match(regex) || [];
            
            // Gereksiz sistem kelimelerini filtrele
            const cop = ['follow', 'following', 'takip', 'et', 'profil', 'resmi', 'post', 'followers', 'posts', 'message', 'suggested', 'kapat', 'ayarlar', 'beğen', 'yanıtla', 'gönder', 'paylaş', 'kaydet', 'tümü', 'gör', 'onaylı', 'ara', 'keşfet'];
            
            return [...new Set(bulunanlar.map(m => m.toLowerCase()))]
                   .filter(m => m.length > 2 && !cop.includes(m) && isNaN(m));
        }

        function sayilariGuncelle() {
            const ben = temizle(document.getElementById('following').value);
            const onlar = temizle(document.getElementById('followers').value);
            document.getElementById('countFollowing').innerText = ben.length;
            document.getElementById('countFollowers').innerText = onlar.length;
        }

        function kacaklariBul() {
            const takipEttiklerim = temizle(document.getElementById('following').value);
            const takipcilerim = temizle(document.getElementById('followers').value);

            if (takipEttiklerim.length === 0 || takipcilerim.length === 0) {
                alert("Aga önce listeleri yapıştır.");
                return;
            }

            // MANTIK: Ben takip ediyorum ama o beni etmiyor
            const kacaklar = takipEttiklerim.filter(u => !takipcilerim.includes(u));
            
            const resultsDiv = document.getElementById('results');
            const resultArea = document.getElementById('resultArea');
            const badCountSpan = document.getElementById('badCount');

            resultsDiv.innerHTML = "";
            badCountSpan.innerText = kacaklar.length + " KİŞİ";
            resultArea.classList.remove('hidden');

            if (kacaklar.length === 0) {
                resultsDiv.innerHTML = "<p class='col-span-full text-center text-gray-500 text-xs italic'>Seni herkes geri takip ediyor, sıkıntı yok aga.</p>";
            } else {
                kacaklar.forEach(user => {
                    const card = document.createElement('div');
                    card.className = "user-card group hover:border-indigo-500 transition-all";
                    card.innerHTML = `
                        <p class="text-[10px] font-bold text-slate-300">@${user}</p>
                        <a href="https://instagram.com/${user}" target="_blank" class="text-[8px] mt-2 text-indigo-400 block uppercase font-black hover:text-white transition-all">PROFİL</a>
                    `;
                    resultsDiv.appendChild(card);
                });
            }

            resultArea.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
